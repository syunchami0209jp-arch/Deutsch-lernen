<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ドイツ語クエスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

  <!-- ==================== -->
  <!-- トップページ -->
  <!-- ==================== -->

  <section id="home" class="screen">

    <h1>🇩🇪 ドイツ語クエスト</h1>

    <div class="top-menu">

      <button class="primary top-menu-button"
              onclick="openVocabulary()">
        語彙と表現
      </button>

      <button class="primary top-menu-button"
              onclick="openVerbPractice()">
        動詞の活用練習
      </button>

    </div>

  </section>


  <!-- ==================== -->
  <!-- 語彙と表現 -->
  <!-- ==================== -->

  <section id="vocab" class="screen hidden">

    <button onclick="goHome()">
      ← トップページ
    </button>

    <h1>語彙と表現</h1>

    <div id="lesson-buttons"></div>

  </section>


  <!-- ==================== -->
  <!-- 語彙と表現：カテゴリー -->
  <!-- ==================== -->

  <section id="menu" class="screen hidden">

    <button onclick="goVocabulary()">
      ← 語彙と表現
    </button>

    <h1 id="lesson-title"></h1>

    <div id="category-buttons"></div>

  </section>


  <!-- ==================== -->
  <!-- 動詞の活用練習 -->
  <!-- ==================== -->

  <section id="verb-menu" class="screen hidden">

    <button onclick="goHome()">
      ← トップページ
    </button>

    <h1>動詞の活用練習</h1>

    <div class="verb-menu-buttons">

      <button class="primary"
              onclick="openVerbType('直接法現在')">
        直接法現在
      </button>

      <button class="primary"
              onclick="openVerbType('三基本形')">
        三基本形
      </button>

      <button class="primary"
              onclick="openVerbType('接続法Ⅱ式')">
        接続法Ⅱ式
      </button>

      <button class="primary"
              onclick="alert('全て出題は後で機能を追加します。')">
        全て出題
      </button>

      <button class="primary"
              onclick="alert('変化表は後で機能を追加します。')">
        変化表
      </button>

    </div>

  </section>


  <!-- ==================== -->
  <!-- 動詞：練習形式選択 -->
  <!-- ==================== -->

  <section id="verb-types" class="screen hidden">

    <button onclick="openVerbPractice()">
      ← 動詞の活用練習
    </button>

    <h1 id="verb-type-title"></h1>

    <div class="verb-menu-buttons">

      <button class="primary"
              onclick="alert('動詞独日カードは後で機能を追加します。')">
        動詞独日カード
      </button>

      <button class="primary"
              onclick="alert('変化表空欄補充タイピングは後で機能を追加します。')">
        変化表空欄補充タイピング
      </button>

      <button class="primary"
              onclick="alert('文の空欄補充四択は後で機能を追加します。')">
        文の空欄補充四択
      </button>

      <button class="primary"
              onclick="alert('文の空欄タイピングは後で機能を追加します。')">
        文の空欄タイピング
      </button>

    </div>

  </section>


  <!-- ==================== -->
  <!-- 練習画面 -->
  <!-- ==================== -->

  <section id="practice" class="screen hidden">

    <button id="practice-back">
      ← 練習メニュー
    </button>

    <div id="progress"></div>

    <div id="practice-content"></div>

  </section>


</main>


<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>

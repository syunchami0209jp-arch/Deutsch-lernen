<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ドイツ語クエスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">

  <!-- トップページ -->
  <section id="home" class="screen">
    <h1>🇩🇪 ドイツ語クエスト</h1>

    <div class="top-menu">
      <button class="primary top-menu-button" onclick="openVocabulary()">
        語彙と表現
      </button>

      <button class="primary top-menu-button" onclick="alert('動詞の活用練習は現在準備中です。')">
        動詞の活用練習
      </button>
    </div>
  </section>

  <!-- 語彙と表現：課選択 -->
  <section id="vocab" class="screen hidden">
    <button onclick="goHome()">← トップページ</button>
    <h1>語彙と表現</h1>
    <div id="lesson-buttons"></div>
  </section>

  <!-- 語彙と表現：カテゴリー選択 -->
  <section id="menu" class="screen hidden">
    <button onclick="goVocabulary()">← 語彙と表現</button>
    <h1 id="lesson-title"></h1>
    <div id="category-buttons"></div>
  </section>

  <!-- 練習画面 -->
  <section id="practice" class="screen hidden">
    <button id="practice-back">← 練習メニュー</button>
    <div id="progress"></div>
    <div id="practice-content"></div>
  </section>

</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
